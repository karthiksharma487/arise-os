<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARISE OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="system-box">
        <div class="header">
            <p id="time-greeting">[ SYSTEM: INITIALIZING... ]</p>
            <h1>HUNTER: <span id="display-name" onclick="changeName()">CLICK TO SET NAME</span></h1>
            <div class="rank">S-RANK</div>
        </div>

        <div class="stats">
            <p>LEVEL: <span id="lvl">1</span></p>
            <div class="exp-container">
                <div id="exp-bar"></div>
            </div>
        </div>

        <div class="tasks">
            <h3>DAILY QUESTS</h3>
            <div class="task-card">
                <span>Push-ups (0/100)</span>
                <button onclick="addXP(20)">DONE</button>
            </div>
            <div class="task-card">
                <span>Running (0/10km)</span>
                <button onclick="addXP(20)">DONE</button>
            </div>
            <div class="task-card">
                <span>Shadow Training</span>
                <button onclick="addXP(20)">DONE</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
